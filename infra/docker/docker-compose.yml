services:
  postgres:
    image: postgres:16-alpine
    container_name: inkflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inkflow
      POSTGRES_USER: inkflow
      POSTGRES_PASSWORD: inkflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
